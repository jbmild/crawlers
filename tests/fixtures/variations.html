<script>
	document.addEventListener('DOMContentLoaded', function() {
		const buttons = document.querySelectorAll(".add-to-cart-button");

			if (button.disabled) {
				button.textContent = "Agotado";
			}
		});
	});
</script>

      <td><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol">$</span>4,500.00</bdi></span></td>
      <td>
        <form class="cart" method="post">
          <input type="hidden" name="add-to-cart" value="339133" />

        </form>

    </tr>

    </tr>
  </tbody>
</table>
</body>
</html>
